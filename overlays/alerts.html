<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Vasper Alerts</title>
  <link rel="stylesheet" href="../shared/crt.css?v=8">
  <link rel="preload" href="../shared/fonts/PressStart2P-Regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="../shared/fonts/VT323-Regular.woff" as="font" type="font/woff" crossorigin>
  <style>
    /* Full-width row that centres the alert, so the box can use up to its
       max-width instead of being squeezed to half the screen */
    .stage {
      position: absolute;
      top: 80px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
    }

    .alert {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 24px;
      min-width: 520px;
      max-width: 760px;
      padding: 24px 32px 24px 24px;
      animation: drop-in 0.45s var(--ease-bounce) both;
    }
    .alert.is-leaving { animation: drop-out 0.3s var(--ease-in) both; }

    @keyframes drop-in  { from { transform: translate3d(0, -240px, 0); } }
    @keyframes drop-out { to   { transform: translate3d(0, -240px, 0); opacity: 0; } }

    .alert__icon {
      width: 80px;
      height: 80px;
      image-rendering: pixelated;
      animation: bob 0.6s ease-in-out infinite alternate;
    }
    @keyframes bob { to { transform: translate3d(0, -6px, 0); } }

    .alert__kicker {
      font-family: var(--font-display);
      font-size: 15px;
      color: var(--pink);
      margin-bottom: 12px;
    }

    .alert__headline {
      font-family: var(--font-display);
      font-size: 22px;
      line-height: 1.3;
      color: var(--paper);
    }

    .alert__detail {
      margin-top: 10px;
      font-size: 28px;
      color: var(--cyan);
      overflow-wrap: anywhere;
    }

    /* Screen flash when an alert lands */
    .flash {
      position: fixed;
      inset: 0;
      background: var(--paper);
      opacity: 0;
      pointer-events: none;
    }
    .flash.is-on { animation: flash 0.35s ease-out; }
    @keyframes flash { 0% { opacity: 0.35; } 100% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="flash" id="flash"></div>
  <div class="stage" id="stage" aria-live="assertive"></div>

  <script type="module">
    import { connectChat, param } from "../shared/twitch-irc.js?v=8";
    import * as stageSetup from "../shared/stage.js?v=8";
    try { (stageSetup.setupStage || stageSetup.fitStage)?.(); } catch (e) { console.warn("stage setup skipped", e); }

    const channel = param("channel", "its_vasper");
    const duration = Number(param("duration", "7")) * 1000;
    const soundOn = param("sound", "1") !== "0";
    const volume = Math.min(1, Math.max(0, Number(param("volume", "0.25"))));
    const minBits = Number(param("minbits", "1"));

    /* ---------- Pixel icons: one character per pixel ---------- */
    const COLORS = { P: "#ff6fb5", p: "#ffc2e2", B: "#4f9dff", b: "#9be7ff", W: "#f6efff", Y: "#ffd36f", V: "#5b2f94", K: "#140a24" };
    const ICONS = {
      heart: [
        "..PP...PP..",
        ".PpPP.PPPP.",
        "PpWPPPPPPPP",
        "PpPPPPPPPPP",
        "PPPPPPPPPPP",
        ".PPPPPPPPP.",
        "..PPPPPPP..",
        "...PPPPP...",
        "....PPP....",
        ".....P.....",
      ],
      star: [
        ".....Y.....",
        "....YYY....",
        "....YWY....",
        "YYYYYYYYYYY",
        ".YYYYYYYYY.",
        "..YYYYYYY..",
        "..YYY.YYY..",
        ".YYY...YYY.",
        ".YY.....YY.",
        "Y.........Y",
      ],
      gift: [
        "..PP...PP..",
        "...PP.PP...",
        "BBBBBPBBBBB",
        "BbbbbPbbbbB",
        "BBBBBPBBBBB",
        ".BbbbPbbbB.",
        ".BbbbPbbbB.",
        ".BbbbPbbbB.",
        ".BbbbPbbbB.",
        ".BBBBBBBBB.",
      ],
      sword: [
        ".........WW",
        "........WbW",
        ".......WbW.",
        "......WbW..",
        ".Y...WbW...",
        "..Y.WbW....",
        "...YbW.....",
        "..VVY......",
        ".VV..Y.....",
        "VV.........",
      ],
    };

    function drawIcon(name) {
      const rows = ICONS[name];
      const canvas = document.createElement("canvas");
      canvas.width = rows[0].length;
      canvas.height = rows.length;
      canvas.className = "alert__icon";
      const ctx = canvas.getContext("2d");
      rows.forEach((row, y) => [...row].forEach((ch, x) => {
        if (!COLORS[ch]) return;
        ctx.fillStyle = COLORS[ch];
        ctx.fillRect(x, y, 1, 1);
      }));
      return canvas;
    }

    /* ---------- 8-bit jingle with Web Audio (square wave, no files) ---------- */
    let audio;
    function jingle(notes) {
      if (!soundOn) return;
      try {
        audio ??= new AudioContext();
        let t = audio.currentTime + 0.02;
        notes.forEach((freq) => {
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = "square";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(volume, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          osc.connect(gain).connect(audio.destination);
          osc.start(t);
          osc.stop(t + 0.13);
          t += 0.09;
        });
      } catch { /* audio blocked: alerts still show */ }
    }
    const C5 = 523, E5 = 659, G5 = 784, C6 = 1047, A5 = 880, D6 = 1175;

    /* ---------- Copy for each event ---------- */
    const COPY = {
      sub:     (e) => ({ kicker: "NEW PARTY MEMBER", headline: `${e.user} subscribed!`, icon: "heart", notes: [C5, E5, G5, C6] }),
      resub:   (e) => ({ kicker: `LEVEL ${e.months}`, headline: `${e.user} resubscribed!`, detail: e.text, icon: "heart", notes: [E5, G5, C6, E5 * 2] }),
      subgift: (e) => ({ kicker: "ITEM GET!", headline: `${e.user} gifted a sub`, detail: e.to ? `to ${e.to}` : "", icon: "gift", notes: [G5, C6, E5, G5, C6] }),
      raid:    (e) => ({ kicker: "A WILD PARTY APPEARS", headline: `${e.user} is raiding!`, detail: `with ${e.amount} adventurers`, icon: "sword", notes: [C5, C5, G5, A5, G5, D6] }),
      cheer:   (e) => ({ kicker: `+${e.amount} BITS`, headline: `${e.user} cheered!`, detail: e.text.replace(/\bcheer\d+\b/gi, "").trim(), icon: "star", notes: [A5, C6, D6] }),
    };

    /* ---------- Queue: one alert at a time ---------- */
    const stage = document.getElementById("stage");
    const flash = document.getElementById("flash");
    const queue = [];
    let busy = false;

    function enqueue(event) {
      const build = COPY[event.type];
      if (!build) return;
      if (event.type === "cheer" && event.amount < minBits) return;
      queue.push(build(event));
      if (!busy) showNext();
    }

    function showNext() {
      const item = queue.shift();
      if (!item) { busy = false; return; }
      busy = true;

      const box = document.createElement("div");
      box.className = "alert pixel-box pixel-box--pink";

      const text = document.createElement("div");
      const kicker = Object.assign(document.createElement("p"), { className: "alert__kicker", textContent: item.kicker });
      const headline = Object.assign(document.createElement("p"), { className: "alert__headline chroma", textContent: item.headline });
      text.append(kicker, headline);
      if (item.detail) {
        text.append(Object.assign(document.createElement("p"), { className: "alert__detail", textContent: item.detail }));
      }

      box.append(drawIcon(item.icon), text);
      stage.replaceChildren(box);

      flash.classList.remove("is-on");
      void flash.offsetWidth;            // restart the flash animation
      flash.classList.add("is-on");
      jingle(item.notes);

      setTimeout(() => {
        box.classList.add("is-leaving");
        setTimeout(() => { box.remove(); showNext(); }, 450);
      }, duration);
    }

    /* Lets other tools trigger alerts: window.postMessage({ vasperAlert: {...} }) */
    window.addEventListener("message", (e) => {
      if (e.data && e.data.vasperAlert) enqueue(e.data.vasperAlert);
    });

    /* ---------- Test mode: ?test=1 cycles every alert ---------- */
    if (param("test") === "1") {
      const samples = [
        { type: "sub", user: "pixelpirate" },
        { type: "raid", user: "RetroGamingSessions", amount: 42 },
        { type: "cheer", user: "mana_potion", amount: 500, text: "Cheer500 for the Kraid fight" },
        { type: "subgift", user: "koopa_kid", to: "save_state" },
        { type: "resub", user: "bluebomber", months: 12, text: "one year of CRT vibes" },
      ];
      let i = 0;
      const loop = () => { enqueue(samples[i++ % samples.length]); setTimeout(loop, duration + 1500); };
      loop();
    } else {
      connectChat(channel, { onEvent: enqueue });
    }
  </script>
</body>
</html>
