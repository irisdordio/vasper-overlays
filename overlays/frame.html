<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Vasper Frame</title>
  <link rel="stylesheet" href="../shared/crt.css?v=8">
  <style>
    /* Gameplay frame: a simple pixel border with a CRT look.
       The game window is 1824x984 at (48, 48). In OBS, put the game capture
       under this source at position 48, 27 and size 1824 x 1026; the border
       trims about 21px off its top and bottom edges. */
    :root { --b: 48px; }

    /* Border fill: plum with scanlines and a soft CRT vignette, cut out
       in the middle so nothing here ever touches the game */
    .border {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, 0.22) 3px, rgba(0, 0, 0, 0) 4px),
        radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.35) 100%),
        var(--plum);
      clip-path: path(evenodd, "M0 0H1920V1080H0Z M48 48H1872V1032H48Z");
      animation: frame-flicker 5s infinite steps(1);
    }
    @keyframes frame-flicker {
      0%, 100% { opacity: 1; }
      47%      { opacity: 0.94; }
      48%      { opacity: 1; }
      82%      { opacity: 0.96; }
      83%      { opacity: 1; }
    }

    /* Pixel line round the game, with notched corners like the chat boxes */
    .window {
      position: absolute;
      inset: var(--b);
      box-shadow:
        0 calc(var(--px) * -1) 0 0 var(--paper),
        0 var(--px) 0 0 var(--paper),
        calc(var(--px) * -1) 0 0 0 var(--paper),
        var(--px) 0 0 0 var(--paper);
    }

    /* Small pixel stars scattered over the border, twinkling slowly */
    .star {
      position: absolute;
      width: 4px; height: 4px;
      opacity: 0;
      animation: star-twinkle 4s ease-in-out infinite;
    }
    @keyframes star-twinkle {
      0%, 100% { opacity: 0; }
      50%      { opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div class="border" aria-hidden="true"></div>
  <div class="window" aria-hidden="true"></div>
  <div id="stars" aria-hidden="true"></div>
  <!-- ?crt=full: light scanlines over the game too -->
  <div class="crt" id="crt" aria-hidden="true" hidden></div>

  <script type="module">
    import { param } from "../shared/twitch-irc.js?v=8";
    import * as stageSetup from "../shared/stage.js?v=8";
    try { (stageSetup.setupStage || stageSetup.fitStage)?.(); } catch (e) { console.warn("stage setup skipped", e); }

    /* Stars: a few per side, kept inside the border and on the 4px grid */
    const B = 48;
    const count = Math.min(40, Math.max(0, Number(param("stars", "16"))));
    const colors = ["var(--paper)", "var(--pink-soft)", "var(--cyan)"];
    const snap = (n) => Math.round(n / 4) * 4;
    for (let i = 0; i < count; i++) {
      const side = i % 4;   // top, right, bottom, left
      const along = 80 + Math.random() * ((side % 2 ? 1080 : 1920) - 160);
      const across = 16 + Math.random() * (B - 32);   // stays clear of both edges of the border
      const [x, y] = [
        [along, across],
        [1920 - across, along],
        [along, 1080 - across],
        [across, along],
      ][side];
      const c = colors[i % colors.length];
      const s = document.createElement("span");
      s.className = "star";
      s.style.left = `${snap(x)}px`;
      s.style.top = `${snap(y)}px`;
      s.style.background = c;
      s.style.boxShadow = `4px 0 ${c}, -4px 0 ${c}, 0 4px ${c}, 0 -4px ${c}`;   // tiny plus, like the scene sparkles
      const dur = 3 + Math.random() * 4;
      s.style.animationDuration = `${dur}s`;
      s.style.animationDelay = `${-Math.random() * dur}s`;
      document.getElementById("stars").appendChild(s);
    }

    if (param("crt") === "full") {
      const crt = document.getElementById("crt");
      crt.hidden = false;
      crt.style.opacity = "0.5";
    }
  </script>
</body>
</html>
