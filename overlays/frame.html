<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Vasper Frame</title>
  <link rel="stylesheet" href="../shared/crt.css?v=8">
  <style>
    /* Gameplay frame: a thick border round a 16:9 window for the game.
       The window is 1776x999 at (72, 40). In OBS, put the game capture
       under this source and set its position and size to match. */
    #frame { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
  </style>
</head>
<body>
  <svg id="frame" viewBox="0 0 1920 1080" aria-hidden="true" shape-rendering="crispEdges">
    <defs>
      <!-- Pastel: soft vertical blend from the avatar palette -->
      <linearGradient id="pastel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="#ffe3f1"/>
        <stop offset="0.45" stop-color="#e9c8f5"/>
        <stop offset="1"    stop-color="#b9c4ff"/>
      </linearGradient>

      <!-- Stripes: the same moving stripes as the scenes -->
      <pattern id="stripes" width="192" height="192" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
        <rect width="48" height="192" x="0"   fill="#2c1450"/>
        <rect width="48" height="192" x="48"  fill="#5b2f94"/>
        <rect width="48" height="192" x="96"  fill="#2c1450"/>
        <rect width="48" height="192" x="144" fill="#7a3aa8"/>
        <animateTransform id="stripes-run" attributeName="patternTransform" type="translate"
          from="0 0" to="-192 0" dur="4s" repeatCount="indefinite" additive="sum"/>
      </pattern>

      <!-- Scanlines laid over the frame only, never over the game -->
      <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
        <rect y="3" width="4" height="1" fill="#000" fill-opacity="0.12"/>
      </pattern>
    </defs>

    <path id="fill" fill-rule="evenodd" fill="url(#pastel)"/>
    <path id="scanlines" fill-rule="evenodd" fill="url(#scan)"/>
    <!-- Rim round the window: ink outside, a light line, then a pink line next to the game -->
    <path id="rim-ink"   fill="none" stroke="#140a24" stroke-width="12"/>
    <path id="rim-light" fill="none" stroke="#f6efff" stroke-width="6"/>
    <path id="rim-pink"  fill="none" stroke="#ff6fb5" stroke-width="2"/>
  </svg>

  <script type="module">
    import { param } from "../shared/twitch-irc.js?v=8";
    import * as stageSetup from "../shared/stage.js?v=8";
    try { (stageSetup.setupStage || stageSetup.fitStage)?.(); } catch (e) { console.warn("stage setup skipped", e); }

    /* The game window */
    const WIN = { x: 72, y: 40, w: 1776, h: 999 };
    const radius = Math.min(96, Math.max(0, Number(param("radius", "40")) || 0));
    const STEP = 4;   // one pixel of the SNES grid

    /* Rounded rectangle whose curves are drawn as 4px stairs */
    function pixelRoundRect({ x, y, w, h }, r) {
      r = Math.round(r / STEP) * STEP;
      if (r === 0) return `M${x} ${y}H${x + w}V${y + h}H${x}Z`;
      // for each row of the curve, how far the edge is pushed in
      const inset = [];
      for (let i = 0; i < r; i += STEP) {
        const dy = r - i - STEP / 2;
        inset.push(Math.round((r - Math.sqrt(r * r - dy * dy)) / STEP) * STEP);
      }
      const pts = [];
      // top-left, going down the left edge from the top
      inset.forEach((d, i) => { pts.push([x + d, y + i * STEP], [x + d, y + (i + 1) * STEP]); });
      // bottom-left
      [...inset].reverse().forEach((d, i) => { pts.push([x + d, y + h - r + i * STEP], [x + d, y + h - r + (i + 1) * STEP]); });
      // bottom-right, going up the right edge
      inset.forEach((d, i) => { pts.push([x + w - d, y + h - i * STEP], [x + w - d, y + h - (i + 1) * STEP]); });
      // top-right
      [...inset].reverse().forEach((d, i) => { pts.push([x + w - d, y + r - i * STEP], [x + w - d, y + r - (i + 1) * STEP]); });
      return "M" + pts.map((p) => p.join(" ")).join("L") + "Z";
    }

    const win = pixelRoundRect(WIN, radius);
    const outer = "M0 0H1920V1080H0Z";
    document.getElementById("fill").setAttribute("d", outer + win);
    document.getElementById("scanlines").setAttribute("d", outer + win);

    /* Rims are centred on a path pushed out from the window, so they sit on the frame */
    const ring = (grow) => pixelRoundRect(
      { x: WIN.x - grow, y: WIN.y - grow, w: WIN.w + grow * 2, h: WIN.h + grow * 2 }, radius + grow);
    document.getElementById("rim-ink").setAttribute("d", ring(6));
    document.getElementById("rim-light").setAttribute("d", ring(3));
    document.getElementById("rim-pink").setAttribute("d", ring(1));

    /* Theme */
    if (param("theme", "pastel") === "stripes") {
      document.getElementById("fill").setAttribute("fill", "url(#stripes)");
    } else {
      document.getElementById("stripes-run").remove();   // nothing to animate
    }
  </script>
</body>
</html>
